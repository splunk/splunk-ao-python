name: Release splunk-ao to Test PyPI

on:
  pull_request:  # Runs the build job on every PR push to validate packaging
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.2.3, 2.0.0b1). Leave empty to use the version already in pyproject.toml.'
        required: false
        type: string

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Override version
        if: inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          poetry version "$INPUT_VERSION"
          sed -i "s/__version__ = \".*\"/__version__ = \"${INPUT_VERSION}\"/" src/splunk_ao/__init__.py

      - name: Get current version
        id: get-version
        run: echo "version=$(poetry version --short)" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: poetry build

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: splunk-ao-${{ steps.get-version.outputs.version }}
          path: dist/

  publish:
    name: Publish to Test PyPI
    if: github.event_name == 'workflow_dispatch'  # Only publish on explicit dispatch, not on PR pushes
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC trusted publishing
    environment:
      name: testpypi
      url: https://test.pypi.org/project/splunk-ao/

    steps:
      - name: Download distributables
        uses: actions/download-artifact@v4
        with:
          name: splunk-ao-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          print-hash: true
