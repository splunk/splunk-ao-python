[project]
name = "multi-agent-travel-planner-otel"
version = "0.1.0"
description = "Multi-agent LangGraph travel planner with upstream OpenTelemetry instrumentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.0",
    "langchain-openai>=1.1.0",
    "langgraph>=1.0.0",
    "opentelemetry-instrumentation-genai-langchain[instruments]>=1.0b0",
    "python-dotenv>=1.1.0",
    "splunk-ao",
]

[tool.uv.sources]
splunk-ao = { path = "../../..", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.12.3",
]
