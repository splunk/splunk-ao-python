[project]
name = "microsoft-365-agents-sdk-example"
version = "0.1.0"
description = "Microsoft 365 Agents SDK + MS A365 Observability + Splunk AO Logger demo"
requires-python = ">=3.11"
dependencies = [
    "splunk-ao",
    "openai>=1.0.0",
    "opentelemetry-exporter-otlp-proto-http",
    "microsoft-agents-hosting-aiohttp>=1.1.0",
    "microsoft-agents-authentication-msal>=1.1.0",
    "microsoft-agents-a365-observability-core>=1.0.0",
    "microsoft-agents-a365-observability-hosting>=1.0.0",
    "microsoft-agents-a365-observability-extensions-openai>=1.0.0",
    "azure-identity>=1.19.0",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
splunk-ao = { path = "../../..", editable = true }
